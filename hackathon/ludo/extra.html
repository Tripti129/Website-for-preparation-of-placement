<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Schedule Interview — EduNerve AI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#07101a;
    --glass: rgba(255,255,255,0.06);
    --accent1:#00eaff;
    --accent2:#8b5cf6;
    --muted:#9fb0c8;
  }
  body{margin:0;font-family:Poppins,system-ui;background:var(--bg);color:#e9f2ff;display:flex;justify-content:center;align-items:center;height:100vh;padding:20px}
  .card{
    width:420px;background:linear-gradient(180deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
    border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(8px);
    padding:24px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  h2{margin:0 0 18px;font-weight:600;color:var(--accent1);}
  .field{display:flex;flex-direction:column;margin-bottom:14px;font-size:14px;}
  .field label{margin-bottom:6px;color:var(--muted)}
  .field input,.field select,textarea{
    padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.05);color:#e9f2ff;
  }
  textarea{min-height:90px;resize:none}
  button{
    width:100%;padding:12px;border:none;border-radius:12px;font-weight:600;font-size:15px;margin-top:6px;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#041018;cursor:pointer
  }
  .back{
    display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:16px;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="back" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i> Back</div>
    <h2>Schedule Interview</h2>
    <div class="field">
      <label>Interview Type</label>
      <select>
        <option>Technical</option>
        <option>HR</option>
        <option>Behavioral</option>
      </select>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date">
    </div>
    <div class="field">
      <label>Time</label>
      <input type="time">
    </div>
    <div class="field">
      <label>Duration</label>
      <select>
        <option>15 minutes</option>
        <option>30 minutes</option>
        <option>45 minutes</option>
        <option>1 hour</option>
      </select>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea placeholder="Mention agenda or topics..."></textarea>
    </div>
    <button>Confirm Schedule</button>
  </div>
</body>
</html>
