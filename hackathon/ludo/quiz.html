<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EduNerve AI — Smart Quiz Zone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root{
    --bg:#07101a;
    --card:#0f1720aa;
    --glass: rgba(255,255,255,0.06);
    --accent1:#00eaff;
    --accent2:#8b5cf6;
    --muted:#9fb0c8;
  }
  html,body{height:100%;margin:0;font-family:Poppins,system-ui,Arial; background:var(--bg); overflow:hidden;color:#e9f2ff}
  #bgCanvas{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#07101a,#081426 60%);}
  #splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#07101a,#051022);flex-direction:column}
  #splash .logo{font-size:28px;font-weight:700;color:var(--accent2);text-shadow:0 6px 30px rgba(139,92,246,.08)}
  #splash .bar{width:360px;height:10px;border-radius:8px;background:rgba(255,255,255,0.06);margin-top:18px;overflow:hidden}
  #splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));border-radius:8px;box-shadow:0 8px 30px rgba(0,160,255,.12);transition:width .2s ease}

  .app{position:relative;z-index:5;display:flex;height:100vh;}
  .side{width:84px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-right:1px solid rgba(255,255,255,0.04);backdrop-filter:blur(10px);padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.02);}
  .side .brand{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent1));display:flex;align-items:center;justify-content:center;font-weight:700;color:white;box-shadow:0 8px 30px rgba(139,92,246,.12)}
  .side .nav{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .side .nav button{width:56px;height:56px;border-radius:12px;border:none;background:transparent;color:#bfe8ff;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .18s}
  .side .nav button:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(0,160,255,.08);color:var(--accent1)}
  .mainwrap{flex:1;padding:28px 36px;display:flex;flex-direction:column;gap:18px;overflow:auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .user-mini{display:flex;align-items:center;gap:10px;background:var(--glass);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.04)}
  .user-mini img{width:36px;height:36px;border-radius:8px;object-fit:cover;border:2px solid rgba(0,0,0,0.2)}
  .hero{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);box-shadow:0 8px 40px rgba(10,15,30,.35)}
  .panel{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:14px;padding:22px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 8px 40px rgba(10,15,30,.35)}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  select,input[type="number"]{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#e8f9ff;padding:10px;border-radius:10px;outline:none}
  .btn-primary{padding:10px 16px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#001018;font-weight:700;cursor:pointer}
  .btn-ghost{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--muted);cursor:pointer}
  .quiz-area{display:flex;gap:20px;align-items:flex-start;margin-top:12px}
  .q-card{flex:1;border-radius:12px;padding:18px}
  .q-text{font-size:18px;margin-bottom:12px;color:#eaf6ff}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:rgba(255,255,255,0.01);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .opt.correct{background:linear-gradient(90deg, rgba(0,220,150,0.12), rgba(0,220,150,0.06));border-color:rgba(0,200,140,0.2);color:#bfffe6}
  .opt.wrong{background:linear-gradient(90deg, rgba(255,80,80,0.06), rgba(255,80,80,0.03));border-color:rgba(255,80,80,0.14);color:#ffdede}
  footer{margin-top:18px;font-size:13px;color:var(--muted);opacity:0.9;padding:10px;text-align:center}
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="splash">
  <div class="logo">EduNerve AI</div>
  <div class="bar"><i id="sbar"></i></div>
  <div style="color:var(--muted);font-size:13px;margin-top:8px">Preparing smart quiz generator…</div>
</div>

<div class="app" id="app" style="opacity:0">
  <div class="side">
    <div class="brand">EN</div>
    <div class="nav">
      <button title="Back" onclick="window.location.href='index.html'"><i class="fa-solid fa-arrow-left"></i></button>
      <button title="Courses"><i class="fa-solid fa-book-open"></i></button>
      <button title="Progress"><i class="fa-solid fa-chart-line"></i></button>
      <button title="Settings"><i class="fa-solid fa-gear"></i></button>
    </div>
  </div>

  <div class="mainwrap">
    <div class="topbar">
      <h1>Smart Quiz Zone</h1>
      <div class="user-mini">
        <img src="https://i.ibb.co/6v6Lx3C/user.png" alt="user">
        <div><div style="font-weight:600">Sneha Bathla</div><div style="font-size:12px;color:var(--muted)">B.Tech CSE • EduNerve</div></div>
      </div>
    </div>

    <div class="hero panel">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#001018;font-size:28px">Q</div>
        <div>
          <div style="font-weight:700">AI-Generated Adaptive Quizzes</div>
          <div style="color:var(--muted);font-size:13px">Personalized based on your past performance.</div>
        </div>
      </div>

      <div class="controls">
        <select id="topicSelect">
          <option>Arrays</option>
          <option>OOP</option>
          <option>Operating System</option>
          <option>Database</option>
          <option>NLP</option>
        </select>
        <select id="difficulty">
          <option>Easy</option>
          <option selected>Medium</option>
          <option>Hard</option>
        </select>
        <input type="number" id="qcount" min="3" max="15" value="5">
        <button class="btn-primary" id="genBtn">Generate Quiz</button>
      </div>
    </div>

    <div class="quiz-area">
      <div class="q-card panel" id="quizCard">
        <div id="qIndex" style="margin-bottom:10px">Question 0 / 0</div>
        <div class="q-text" id="questionText">Click "Generate Quiz" to begin.</div>
        <div class="options" id="optionsBox"></div>
        <div style="margin-top:12px;display:flex;justify-content:space-between">
          <button class="btn-ghost" id="prevBtn" disabled>Previous</button>
          <button class="btn-primary" id="nextBtn" disabled>Next</button>
        </div>
        <div style="margin-top:10px;color:var(--muted)" id="resultBox"></div>
      </div>
    </div>

    <footer>© 2025 EduNerve AI — Smart Learning & Assessment</footer>
  </div>
</div>

<script>
  // Splash animation
  const sbar = document.getElementById("sbar");
  let w = 0;
  const splashInt = setInterval(() => {
    w += 4;
    sbar.style.width = w + "px";
    if (w >= 360) {
      clearInterval(splashInt);
      document.getElementById("splash").style.display = "none";
      document.getElementById("app").style.opacity = 1;
    }
  }, 15);

  // Quiz database
  const QUESTIONS = {
    Arrays: [
      { q: "What is the index of the first element in an array?", opts: ["1", "0", "-1", "Depends on language"], ans: "0" },
      { q: "Which operation adds an element at the end?", opts: ["push()", "pop()", "shift()", "unshift()"], ans: "push()" },
      { q: "Which method removes last element?", opts: ["slice()", "pop()", "filter()", "map()"], ans: "pop()" }
    ],
    OOP: [
      { q: "Which concept allows using same function name with different forms?", opts: ["Encapsulation", "Abstraction", "Polymorphism", "Inheritance"], ans: "Polymorphism" },
      { q: "Private members are accessible to?", opts: ["All classes", "Same class only", "Derived classes", "Global scope"], ans: "Same class only" }
    ],
    "Operating System": [
      { q: "Which is not a scheduling algorithm?", opts: ["FCFS", "SJF", "LRU", "RR"], ans: "LRU" },
      { q: "Semaphore is used for?", opts: ["Synchronization", "Deadlock", "Compilation", "Paging"], ans: "Synchronization" }
    ],
    Database: [
      { q: "SQL stands for?", opts: ["Structured Query Language", "Sequential Query Logic", "Standard Question Language", "None"], ans: "Structured Query Language" },
      { q: "Which command removes a table?", opts: ["DROP", "DELETE", "REMOVE", "CLEAR"], ans: "DROP" }
    ],
    NLP: [
      { q: "NLP stands for?", opts: ["Natural Language Processing", "Neural Linguistic Program", "Normal Language Parser", "None"], ans: "Natural Language Processing" },
      { q: "Tokenization means?", opts: ["Combining words", "Splitting text into words", "Removing punctuation", "Translating text"], ans: "Splitting text into words" }
    ]
  };

  let quiz = [], index = 0, score = 0, startTime = 0;

  function savePerformance(topic, difficulty, rubric) {
    const data = JSON.parse(localStorage.getItem("quizHistory")) || [];
    data.push({ topic, difficulty, rubric, date: new Date().toISOString() });
    localStorage.setItem("quizHistory", JSON.stringify(data));
  }

  function getWeakTopic() {
    const data = JSON.parse(localStorage.getItem("quizHistory")) || [];
    const avgByTopic = {};
    data.forEach(r => {
      const acc = r.rubric.Accuracy;
      avgByTopic[r.topic] = avgByTopic[r.topic] || [];
      avgByTopic[r.topic].push(acc);
    });
    let weakest = null, min = 100;
    for (const [t, arr] of Object.entries(avgByTopic)) {
      const avg = arr.reduce((a, b) => a + b) / arr.length;
      if (avg < min) { min = avg; weakest = t; }
    }
    return weakest;
  }

  function loadQuestion() {
    const q = quiz[index];
    document.getElementById("qIndex").textContent = `Question ${index + 1} / ${quiz.length}`;
    document.getElementById("questionText").textContent = q.q;
    const box = document.getElementById("optionsBox");
    box.innerHTML = "";
    q.opts.forEach(opt => {
      const div = document.createElement("div");
      div.className = "opt";
      div.textContent = opt;
      div.onclick = () => selectAnswer(div, opt);
      box.appendChild(div);
    });
    document.getElementById("prevBtn").disabled = index === 0;
    document.getElementById("nextBtn").disabled = true;
  }

  function selectAnswer(div, opt) {
    const q = quiz[index];
    const opts = document.querySelectorAll(".opt");
    opts.forEach(o => o.style.pointerEvents = "none");
    if (opt === q.ans) { div.classList.add("correct"); score++; }
    else div.classList.add("wrong");
    document.getElementById("nextBtn").disabled = false;
  }

  document.getElementById("nextBtn").onclick = () => {
    index++;
    if (index < quiz.length) loadQuestion();
    else finishQuiz();
  };
  document.getElementById("prevBtn").onclick = () => {
    if (index > 0) { index--; loadQuestion(); }
  };

  function finishQuiz() {
    const topic = document.getElementById("topicSelect").value;
    const diff = document.getElementById("difficulty").value;
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const accuracy = Math.round((score / quiz.length) * 100);
    const rubric = {
      Accuracy: accuracy,
      Time: Math.max(100 - Math.floor(elapsed / quiz.length) * 5, 40),
      Concept: diff === "Hard" ? Math.min(100, accuracy + 10) : accuracy,
      Consistency: Math.min(100, 90 - Math.abs(accuracy - 80))
    };

    savePerformance(topic, diff, rubric);
    document.getElementById("questionText").textContent = `🎯 You scored ${accuracy}%`;
    document.getElementById("optionsBox").innerHTML = "";
    document.getElementById("qIndex").textContent = "Quiz Completed!";
    document.getElementById("resultBox").innerHTML =
      `Rubric saved:<br>Accuracy: ${rubric.Accuracy}% • Time: ${rubric.Time}% • Concept: ${rubric.Concept}% • Consistency: ${rubric.Consistency}%<br>
       <a href="assessment.html" style="color:#00eaff;text-decoration:underline;">View Assessment Report →</a>`;
    document.getElementById("nextBtn").disabled = true;
    document.getElementById("prevBtn").disabled = true;
  }

  document.getElementById("genBtn").onclick = () => {
    const weak = getWeakTopic();
    if (weak) {
      alert(`Based on your previous results, you should practice: ${weak}`);
      document.getElementById("topicSelect").value = weak;
    }
    const topic = document.getElementById("topicSelect").value;
    const diff = document.getElementById("difficulty").value;
    const count = parseInt(document.getElementById("qcount").value);
    const pool = QUESTIONS[topic] || [];
    quiz = pool.sort(() => 0.5 - Math.random()).slice(0, count);
    if (quiz.length === 0) { alert("No questions found!"); return; }
    index = 0; score = 0; startTime = Date.now();
    loadQuestion();
  };
</script>

</body>
</html>
