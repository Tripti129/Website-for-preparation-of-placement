<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduNerve AI - Virtual Interview Trainer</title>
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0b1220, #1b2838);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      background: rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      padding: 20px 30px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .ai-icon {
      font-size: 40px;
    }

    .user-text h2 {
      font-size: 20px;
    }

    .readiness {
      text-align: center;
    }

    #confidenceScore {
      display: block;
      font-size: 36px;
      color: #4af3c2;
      margin: 5px 0;
    }

    .main-content {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .trainer, .interview-section {
      flex: 1 1 45%;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      min-height: 400px;
    }

    video {
      width: 100%;
      max-height: 300px;
      border-radius: 10px;
      background: #000;
    }

    button {
      background: #4af3c2;
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
      margin-top: 15px;
    }

    button:hover {
      transform: scale(1.05);
      background: #38d6aa;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    #eyeContactText {
      margin-top: 10px;
      color: #f8d47f;
      font-weight: 500;
    }

    #feedbackText {
      margin-top: 15px;
      font-size: 16px;
      color: #b5f5d6;
    }

    footer {
      text-align: center;
      margin-top: 20px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Virtual Interview Trainer</h1>

    <div class="top-bar">
      <div class="user-info">
        <div class="ai-icon">🤖</div>
        <div class="user-text">
          <h2>AI Assistant Interviewer</h2>
          <p>Mock interview with camera & voice feedback</p>
        </div>
      </div>

      <div class="readiness">
        <p>Confidence Score</p>
        <span id="confidenceScore">--%</span>
        <button onclick="analyzeConfidence()">Analyze</button>
      </div>
    </div>

    <div class="main-content">
      <div class="trainer">
        <h3>Camera</h3>
        <video id="camera" autoplay muted playsinline></video>
        <button onclick="startCamera()">Start Camera</button>
        <div id="confidenceText"></div>
        <div id="eyeContactText"></div>
      </div>

      <div class="interview-section">
        <h3>Interview</h3>
        <p id="interviewQuestion">Click "Next" to begin.</p>

        <div class="button-group">
          <button onclick="nextQuestion()">Next</button>
          <button onclick="startListening()">🎙 Answer</button>
        </div>

        <p><strong>Your Answer:</strong> <span id="userAnswer"></span></p>
        <div id="feedbackText"></div>
      </div>
    </div>

    <footer>🎤 Speak clearly and maintain eye contact for best results.</footer>
  </div>

  <script>
    const video = document.getElementById('camera');
    const confidenceText = document.getElementById('confidenceText');
    const confidenceScore = document.getElementById('confidenceScore');
    const eyeContactText = document.getElementById('eyeContactText');
    const interviewQuestion = document.getElementById('interviewQuestion');
    const userAnswer = document.getElementById('userAnswer');
    const feedbackText = document.getElementById('feedbackText');

    const questions = [
      "Tell me about yourself.",
      "What are your strengths?",
      "Why do you want this job?",
      "Describe a challenge you overcame.",
      "Where do you see yourself in five years?"
    ];
    let currentQuestion = 0;
    let faceModelsLoaded = false;

    // === TEXT-TO-SPEECH ===
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 1;
      speechSynthesis.cancel();
      speechSynthesis.speak(utterance);
    }

    // === CAMERA START ===
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        confidenceText.textContent = "Camera started successfully.";

        if (!faceModelsLoaded) {
          await Promise.all([
            faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/face-api.js/weights")
          ]);
          faceModelsLoaded = true;
        }

        detectEyeContact();
      } catch (error) {
        console.error(error);
        confidenceText.textContent = "Camera access denied or error.";
      }
    }

    // === FACE DETECTION / EYE CONTACT ===
    async function detectEyeContact() {
      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
      setInterval(async () => {
        const detections = await faceapi.detectAllFaces(video, options);
        if (detections.length === 0) {
          eyeContactText.textContent = "Please look towards the camera 👀";
        } else {
          eyeContactText.textContent = "Good eye contact! 👍";
        }
      }, 4000);
    }

    // === CONFIDENCE ANALYSIS ===
    function analyzeConfidence() {
      const score = Math.floor(Math.random() * 50) + 50;
      confidenceScore.textContent = score + "%";
      confidenceText.textContent =
        score > 75 ? "Excellent confidence! 😄" :
        score > 60 ? "Good, but can improve. 🙂" :
        "Try to be more expressive. 😐";
    }

    // === QUESTION FLOW ===
    function nextQuestion() {
      if (currentQuestion < questions.length) {
        const q = questions[currentQuestion];
        interviewQuestion.textContent = q;
        userAnswer.textContent = "";
        feedbackText.textContent = "";
        speak(q);
        currentQuestion++;
      } else {
        interviewQuestion.textContent = "Interview complete!";
        speak("Interview complete! Great job!");
      }
    }

    // === SPEECH RECOGNITION ===
    function startListening() {
      if (!('webkitSpeechRecognition' in window)) {
        alert("Speech recognition not supported in this browser.");
        return;
      }

      const recognition = new webkitSpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        userAnswer.textContent = transcript;
        giveFeedback(transcript);
      };

      recognition.onerror = function(event) {
        feedbackText.textContent = "Voice error: " + event.error;
      };
    }

    // === FEEDBACK ===
    function giveFeedback(answer) {
      const len = answer.trim().length;
      let feedback = "";

      if (len > 100) feedback = "Excellent, detailed response! Very confident.";
      else if (len > 50) feedback = "Good answer, try adding examples or more detail.";
      else feedback = "Answer is short, expand your explanation for clarity.";

      feedbackText.textContent = feedback;
      speak(feedback);
    }
  </script>
</body>
</html>
