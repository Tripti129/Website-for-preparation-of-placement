<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - EduNerveAI</title>
    <style>
        /* General Body and Header Styling (Dark Theme) */
body {
    font-family: 'Poppins', sans-serif; 
    margin: 0;
    padding: 0;
    background-color: #0d0c1d; /* Very dark background */
    color: #e0e0e0; 
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

header {
    background: linear-gradient(135deg, #1a1835, #0d0c1d);
    padding: 30px 20px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    margin-bottom: 40px;
}

header h1 {
    color: #9b59b6; /* Purple accent */
    font-size: 2.8em;
    margin-bottom: 10px;
    letter-spacing: 1px;
}

header p {
    color: #b0b0b0;
    font-size: 1.1em;
}

/* Main Container for Course Cards */
.course-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
    padding: 0px 40px 60px;
    max-width: 1400px;
    margin: auto;
    flex-grow: 1; 
}

/* Course Card Styling and Hover Animation */
.course-card {
    background-color: #1a1835; 
    border-radius: 15px; 
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    padding: 30px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    cursor: pointer; 
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden; 
    z-index: 0;
}

/* Glowing Border Effect */
.course-card::before {
    content: '';
    position: absolute;
    top: -2px;
    left: -2px;
    right: -2px;
    bottom: -2px;
    background: linear-gradient(45deg, #8e44ad, #3498db, #2ecc71);
    z-index: -1;
    border-radius: 17px; 
    opacity: 0; /* Hidden by default */
    transition: opacity 0.4s ease;
}

.course-card:hover::before {
    opacity: 1; /* Show gradient border on hover */
}

.course-card:hover {
    transform: translateY(-8px) scale(1.02); /* Pronounced lift and scale */
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5); 
}

.course-card h3 {
    color: #e0e0e0; 
    margin-top: 0;
    font-size: 1.6em;
    margin-bottom: 15px;
}

/* Progress Bar Styling and Animation */
.progress-bar {
    background-color: #2c2940; 
    border-radius: 5px;
    margin-top: 15px;
    height: 12px; 
    overflow: hidden;
}

.progress {
    height: 100%;
    background: linear-gradient(to right, #9b59b6, #3498db); /* Gradient progress */
    width: 0%; /* Start at 0 for animation */
    transition: width 1s ease-out; /* Slower, smoother transition */
    border-radius: 5px;
}

/* Modal Styling */
.modal {
    display: none; 
    position: fixed;
    z-index: 1000; 
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.7); 
    backdrop-filter: blur(5px);
}

.modal-content {
    background-color: #1a1835; 
    margin: 8% auto;
    padding: 35px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    width: 90%;
    max-width: 700px; 
    border-radius: 15px;
    position: relative;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* Modal Animation Keyframes */
@keyframes fadeInScale {
    from {
        opacity: 0;
        transform: scale(0.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeOutScale {
    from {
        opacity: 1;
        transform: scale(1);
    }
    to {
        opacity: 0;
        transform: scale(0.9);
    }
}

/* Apply opening and closing animations */
.modal-content.modal-opening {
    animation: fadeInScale 0.3s ease-out forwards;
}

.modal-content.modal-closing {
    animation: fadeOutScale 0.3s ease-in forwards;
}


/* Close Button */
.close-button {
    color: #b0b0b0;
    float: right;
    font-size: 32px;
    font-weight: bold;
    position: absolute;
    right: 20px;
    top: 15px;
    cursor: pointer; /* Ensure it looks clickable */
    transition: color 0.2s;
}

.close-button:hover,
.close-button:focus {
    color: #e0e0e0;
}

/* Syllabus Content Styling */
#modal-course-title {
    color: #9b59b6;
    font-size: 2em;
    margin-top: 0;
    margin-bottom: 25px;
}

#modal-syllabus-content ul {
    list-style-type: none;
    padding-left: 0;
}

#modal-syllabus-content ul li {
    background-color: #2c2940; 
    padding: 15px;
    margin-bottom: 10px;
    border-left: 4px solid #3498db; 
    border-radius: 8px;
    color: #e0e0e0;
    transition: background-color 0.2s ease, transform 0.2s ease;
}

#modal-syllabus-content ul li:hover {
    background-color: #3a374c; 
    transform: translateX(5px);
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .course-container {
        grid-template-columns: 1fr;
        padding: 20px;
    }
    .modal-content {
        width: 95%;
        margin: 5% auto;
    }
}
    </style>
</head>
<body>

    <header>
        <h1>My Enrolled Courses 📚</h1>
        <p>Your personalized learning path</p>
    </header>

    <main class="course-container">
        </main>

    <div id="syllabus-modal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-course-title"></h2>
            <div id="modal-syllabus-content">
                </div>
        </div>
    </div>

    <script>
        // 1. Define the Course Data - NOW WITH 7 CARDS
const courses = [
    { 
        id: 'html-css', 
        title: 'Complete HTML & CSS Fundamentals', 
        progress: 75, 
        syllabus: [
            'Module 1: HTML Structure & Semantic Tags',
            'Module 2: CSS Selectors and Box Model',
            'Module 3: Advanced Layouts (Flexbox & Grid)',
            'Module 4: Responsive Web Design',
            'Final Project: Portfolio Website'
        ]
    },
    { 
        id: 'js-basics', 
        title: 'JavaScript Essentials for Web Development', 
        progress: 30, 
        syllabus: [
            'Module 1: Variables, Data Types, and Operators',
            'Module 2: Control Flow and Loops',
            'Module 3: Functions and Scope',
            'Module 4: The Document Object Model (DOM)',
            'Module 5: Event Handling'
        ]
    },
    { 
        id: 'full-stack', 
        title: 'Full Stack Web Development Roadmap', 
        progress: 10, 
        syllabus: [
            'Module 1: Introduction to Backend (Node.js/Python)',
            'Module 2: Express/Django Frameworks',
            'Module 3: Database (MongoDB/SQL)',
            'Module 4: API Design and Testing',
            'Module 5: Deployment & CI/CD'
        ]
    },
    { 
        id: 'react-mastery', 
        title: 'React.js State Management Mastery', 
        progress: 90, 
        syllabus: [
            'Module 1: Components and Props',
            'Module 2: State and Lifecycle Hooks',
            'Module 3: Advanced Hooks (useReducer, useContext)',
            'Module 4: Routing (React Router)',
            'Module 5: Performance Optimization'
        ]
    },
    { 
        id: 'python-data', 
        title: 'Python for Data Science & AI', 
        progress: 55, 
        syllabus: [
            'Module 1: Python Basics and Pandas',
            'Module 2: Data Visualization with Matplotlib',
            'Module 3: Introduction to Machine Learning',
            'Module 4: Building a Predictive Model'
        ]
    },
    { 
        id: 'design-uiux', 
        title: 'UI/UX Design Fundamentals (Figma)', 
        progress: 100, 
        syllabus: [
            'Module 1: User Research & Personas',
            'Module 2: Wireframing and Prototyping',
            'Module 3: Color Theory and Typography',
            'Module 4: Usability Testing',
            'Final Capstone Project'
        ]
    },
    { 
        id: 'devops-intro', 
        title: 'Introduction to DevOps and Cloud', 
        progress: 25, 
        syllabus: [
            'Module 1: Linux and Bash Scripting',
            'Module 2: Containerization (Docker)',
            'Module 3: Orchestration (Kubernetes Basics)',
            'Module 4: Cloud Services (AWS/Azure/GCP Intro)',
            'Module 5: Continuous Integration (CI)'
        ]
    }
];

const container = document.querySelector('.course-container');
const modal = document.getElementById('syllabus-modal');
const modalContent = document.querySelector('.modal-content'); 
const closeBtn = document.querySelector('.close-button');


// --- Helper Function to Handle Modal Closing (Fixed and Functional) ---
function closeModal() {
    // 1. Start the closing animation
    modalContent.classList.add('modal-closing');
    modalContent.classList.remove('modal-opening');

    // 2. Hide the modal *after* the animation finishes
    modalContent.addEventListener('animationend', function handler(event) {
        // Check if the correct closing animation (fadeOutScale) finished
        if (event.animationName === 'fadeOutScale') {
            modal.style.display = 'none';
            modalContent.classList.remove('modal-closing'); // Clean up the class
            this.removeEventListener('animationend', handler); 
        }
    }, { once: true });
}

// 2. Function to Render Course Cards
function renderCourseCards() {
    container.innerHTML = ''; 
    courses.forEach(course => {
        const cardHTML = `
            <div class="course-card" data-course-id="${course.id}">
                <h3>${course.title}</h3>
                <p>Progress: <span class="progress-value">${course.progress}%</span></p>
                <div class="progress-bar">
                    <div class="progress" data-progress="${course.progress}"></div>
                </div>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    });
    
    // Attach Click Listeners to Cards
    document.querySelectorAll('.course-card').forEach(card => {
        card.addEventListener('click', () => openSyllabusModal(card.dataset.courseId));
    });

    // Run the animation function
    animateProgressBars();
}

// Function to animate progress bars
function animateProgressBars() {
    document.querySelectorAll('.progress').forEach(progressBar => {
        const progressValue = progressBar.dataset.progress;
        // Reset width to 0 for animation start (forces reflow)
        progressBar.style.width = '0%'; 
        setTimeout(() => {
            progressBar.style.width = `${progressValue}%`;
        }, 50); // Small delay 
    });
}


// 4. Function to Open Syllabus Modal
function openSyllabusModal(courseId) {
    const course = courses.find(c => c.id === courseId);
    if (!course) return;

    // Populate Modal Content
    document.getElementById('modal-course-title').textContent = course.title;
    
    const syllabusList = course.syllabus.map(item => `<li>${item}</li>`).join('');
    document.getElementById('modal-syllabus-content').innerHTML = `<ul>${syllabusList}</ul>`;

    // Show the Modal
    modal.style.display = 'block';
    // Add class for modal open animation
    modalContent.classList.remove('modal-closing');
    modalContent.classList.add('modal-opening');
}

// 5. Attach Event Listeners
closeBtn.addEventListener('click', closeModal); // Cross button fix is confirmed here

// Close modal if user clicks outside of it
window.addEventListener('click', (event) => {
    if (event.target === modal) {
        closeModal();
    }
});


// Initial load of the course cards
renderCourseCards();
    </script>
</body>
</html>
